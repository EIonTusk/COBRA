[package]
name = "cobra"
version = "0.4.3"
description = "COBRA — Chess Opening Builder and Repertoire Analyzer"
authors = ["EIonTusk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cobra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
