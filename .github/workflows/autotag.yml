name: Auto-tag

# Waits for CI to succeed on a push to main, then bumps the version based on
# the commit subject prefix and runs scripts/release.mjs (which updates
# package.json / tauri.conf.json / Cargo.toml, commits, tags, and pushes).
# The tag push triggers release.yml to build artifacts.
#
#   feat / feat(scope) / feat!  -> minor bump (x.y+1.0)
#   fix  / fix(scope)           -> patch bump (x.y.z+1)
#   anything else               -> skip
#
# Requires a PAT in secret RELEASE_PAT with `contents: write` and
# `workflows: write`. The default GITHUB_TOKEN cannot trigger another
# workflow (release.yml) from its tag push.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # actions: write lets us fall back to dispatching release.yml via the
  # workflow_dispatch trigger when the tag push was made with the default
  # GITHUB_TOKEN (which, by design, can't trigger follow-on workflows).
  actions: write

concurrency:
  group: autotag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      - name: Compute next version
        id: v
        env:
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$MSG" | head -n1)
          # GitHub merge-commit subject is "Merge pull request #N from …".
          # The PR title lives on the first non-blank body line — use that instead.
          if [[ "$SUBJECT" == Merge\ pull\ request\ * ]]; then
            BODY_LINE=$(printf '%s\n' "$MSG" | awk 'NR>1 && NF {print; exit}')
            [ -n "$BODY_LINE" ] && SUBJECT="$BODY_LINE"
          fi
          echo "Parsed subject: $SUBJECT"
          CUR=$(node -p "require('./package.json').version")
          IFS=. read -r X Y Z <<< "$CUR"
          case "$SUBJECT" in
            feat\!:*|feat\(*\)\!:*) NEXT="$X.$((Y+1)).0" ;;
            feat:*|feat\(*\):*)     NEXT="$X.$((Y+1)).0" ;;
            fix:*|fix\(*\):*)       NEXT="$X.$Y.$((Z+1))" ;;
            *)
              echo "No feat/fix prefix in: $SUBJECT"
              exit 0
              ;;
          esac
          echo "Bumping $CUR -> $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Configure git
        if: steps.v.outputs.next
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # workflow_run checkout is detached at head_sha; attach to main so
          # release.mjs's `git push origin HEAD` resolves to the right branch.
          git checkout -B main

      - name: Release
        if: steps.v.outputs.next
        run: npm run release -- ${{ steps.v.outputs.next }} --skip-checks

      # When RELEASE_PAT isn't configured the release script's tag push ran
      # with GITHUB_TOKEN, which GitHub silently refuses to let chain into
      # another workflow — so every downstream workflow wired to
      # `push: tags: v*` (release.yml for desktop/iOS/Android bundles,
      # deploy.yml for GitHub Pages) never fires. Dispatch them explicitly
      # via workflow_dispatch; that path accepts GITHUB_TOKEN provided the
      # job has actions: write.
      - name: Trigger downstream release workflows
        if: steps.v.outputs.next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.next }}"
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
          gh workflow run deploy.yml --ref "$TAG"
